<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08111d" />
    <meta
      name="description"
      content="Xbox Cloud Booster overlay for mobile cloud gaming performance tuning."
    />
    <title>Xbox Cloud Booster</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Cloud gaming overlay</p>
          <h1>Xbox Cloud Booster</h1>
        </div>
        <button id="boostBtn" class="primary-btn">Boost</button>
      </header>

      <section class="status-strip">
        <span class="pill online">LIVE</span>
        <span class="status-text">FPS target: <strong id="fpsStatus">30</strong></span>
      </section>

      <main class="card">
        <section class="preset-panel">
          <h2>Graphics mode</h2>
          <div class="preset-grid">
            <button class="preset active" data-preset="potato">Potato</button>
            <button class="preset" data-preset="balanced">Balanced</button>
            <button class="preset" data-preset="smooth">Smooth</button>
          </div>
        </section>

        <section class="controls">
          <div class="control-group">
            <label for="renderScale">
              <span>Render scale</span>
              <strong id="renderScaleValue">60%</strong>
            </label>
            <input id="renderScale" type="range" min="40" max="100" value="60" />
          </div>

          <div class="control-group">
            <label for="fpsCap">
              <span>Frame cap</span>
              <strong id="fpsCapValue">30 FPS</strong>
            </label>
            <input id="fpsCap" type="range" min="20" max="60" value="30" />
          </div>

          <div class="control-group">
            <label for="latency">
              <span>Network priority</span>
              <strong id="latencyValue">Low latency</strong>
            </label>
            <input id="latency" type="range" min="0" max="100" value="25" />
          </div>
        </section>

        <section class="toggles">
          <label class="switch-row">
            <span>Battery saver</span>
            <input id="batterySaver" type="checkbox" checked />
            <span class="slider"></span>
          </label>

          <label class="switch-row">
            <span>Adaptive cooling</span>
            <input id="cooling" type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </section>

        <section class="stats-panel">
          <h3>Stream snapshot</h3>
          <div class="stats-grid">
            <div class="stat-card">
              <span class="label">Resolution</span>
              <strong id="resolutionText">768x432</strong>
            </div>
            <div class="stat-card">
              <span class="label">Power</span>
              <strong id="powerText">Eco</strong>
            </div>
            <div class="stat-card">
              <span class="label">Latency</span>
              <strong id="networkText">5G</strong>
            </div>
            <div class="stat-card">
              <span class="label">Preset</span>
              <strong id="presetText">Potato</strong>
            </div>
          </div>
        </section>

        <div class="actions">
          <button id="saveBtn" class="secondary-btn">Save preset</button>
          <button id="downloadBtn" class="secondary-btn">Download config</button>
          <button id="installBtn" class="install-btn">Install app</button>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
